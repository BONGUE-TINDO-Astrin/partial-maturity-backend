spring:
  application:
    name: partial-maturity-backend

  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

#  datasource:
#    url: ${DB_URL}
#    username: ${DB_USERNAME}
#    password: ${DB_PASSWORD}
#    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

application:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
      password: ${BOOTSTRAP_ADMIN_PASSWORD}
      full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:Administrateur BeLife}

  spring:
    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info